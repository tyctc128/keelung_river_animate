<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>基隆河影片算圖 v2</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
  body { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; color: #1f2a37; background: linear-gradient(180deg, #a9d8ff, #eef8ff 70%); }
  #view { position: absolute; inset: 0; z-index: 0; }
  #view canvas { display: block; }
  .labels { position: absolute; inset: 0; pointer-events: none; }

  .lbl { font-size: 15px; white-space: nowrap; text-align: center; line-height: 1.25; }
  .lbl.place { background: rgba(255,255,255,.93); padding: 2px 8px; border-radius: 8px; font-weight: bold; color: #263445; box-shadow: 0 1px 4px rgba(0,0,0,.25); position: relative; margin-bottom: 8px; }
  .lbl.place::after { content: ""; position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); border: 5px solid transparent; border-top: 6px solid rgba(255,255,255,.93); border-bottom: 0; }
  .lbl.sea { color: #fff; font-weight: bold; text-shadow: 0 1px 3px rgba(0,40,90,.9); }
  .lbl.sea.big { font-size: 24px; letter-spacing: 8px; }
  .lbl.note { padding: 5px 11px; border-radius: 12px; font-weight: bold; font-size: 17px; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.3); margin-bottom: 4px; }
  .lbl.note small { font-weight: normal; font-size: 13px; }
  .note.blue { background: #1f7ae0; } .note.red { background: #e53935; } .note.orange { background: #f08c00; }
  .note.gray { background: #5b6776; } .note.dark { background: #3b2a1e; }
  .note.seg1 { background: #ff9f1c; } .note.seg2 { background: #a259ff; } .note.seg3 { background: #ff4d8d; }

  #chips { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; gap: 6px; }
    .chip { white-space: nowrap; background: rgba(255,255,255,.85); color: #6b7685; border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 15px; font-weight: bold; display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
  .chip b { width: 22px; height: 22px; border-radius: 50%; background: #e3e8ee; color: #445; display: grid; place-items: center; font-size: 13px; }
  .chip.done { color: #2f6b3a; } .chip.done b { background: #bfe5c4; }
  .chip.on { background: #1f7ae0; color: #fff; transform: scale(1.08); } .chip.on b { background: #fff; color: #1f7ae0; }

  #badge { position: absolute; left: 26px; top: 66px; z-index: 5; background: rgba(255,255,255,.94); border-radius: 16px; padding: 8px 18px 10px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  #badge .era { color: #1f7ae0; font-weight: bold; font-size: 17px; }
  #badge .ttl { font-size: 28px; font-weight: 900; }
  #sub { position: absolute; left: 0; right: 0; bottom: 30px; z-index: 6; text-align: center; }
  #sub span { display: inline-block; max-width: 1120px; background: rgba(15,25,40,.8); color: #fff; font-size: 29px; font-weight: bold; line-height: 1.45; padding: 9px 24px; border-radius: 14px; letter-spacing: 1px; }
  .card { position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; opacity: 0; }
  #titlecard { background: radial-gradient(ellipse at center, rgba(10,40,80,.55), rgba(10,30,60,.88)); }
  #titlecard h1 { font-size: 84px; margin: 0; letter-spacing: 8px; text-shadow: 0 6px 24px rgba(0,0,0,.5); }
  #titlecard h2 { font-size: 34px; margin: 14px 0 0; font-weight: normal; }
  #rewind { background: rgba(255,255,255,.3); color: #1f2a37; }
  #rewind div { font-size: 50px; font-weight: 900; background: rgba(255,255,255,.92); padding: 16px 40px; border-radius: 20px; }
  #endcard { background: linear-gradient(160deg, rgba(20,70,130,.94), rgba(10,35,70,.97)); }
  #endcard h1 { font-size: 58px; margin: 0 0 18px; }
  #endcard p { font-size: 22px; margin: 5px; }
  #endcard .refs { margin-top: 26px; font-size: 16px; opacity: .85; line-height: 1.7; }
</style>
</head>
<body>
<main id="view"></main>
<div id="chips"></div>
<div id="badge"><div class="era"></div><div class="ttl"></div></div>
<div id="sub"><span></span></div>
<div id="titlecard" class="card">
  <h1>基隆河的搶水大戰</h1>
  <h2>為什麼基隆河要大轉彎？</h2>
</div>
<div id="rewind" class="card"><div>⏪ 時光倒流 … 回到很久很久以前</div></div>
<div id="endcard" class="card">
  <h1>大地一直在改變！</h1>
  <p>三條河 → 古台北湖 → 關渡決口 → 盆地下陷、八堵基隆間隆起 → 河水倒流 → 向源侵蝕 → 瑞芳襲奪</p>
  <div class="refs">
    參考資料：鄧屬予等（2004）臺北堰塞湖考證，地理學報 36 期｜鄧屬予（2006）台北盆地之地質研究，西太平洋地質科學 6 卷<br>
    莊展鵬等《台北地質之旅》（遠流出版）中的基隆河演變說明<br>
    ※ 地形為示意圖；各事件的先後與年代，學者說法不一。
  </div>
</div>
<script src="render2.js"></script>
</body>
</html>
