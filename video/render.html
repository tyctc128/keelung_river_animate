<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>基隆河影片算圖</title>
<link rel="stylesheet" href="../web/style.css">
<style>
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  #view { position: absolute; inset: 0; z-index: 0; }
  .lbl { font-size: 15px; transition: none; } .lbl.note { font-size: 17px; }
  #badge {
    position: absolute; left: 28px; top: 24px; z-index: 5; background: rgba(255,255,255,.93);
    border-radius: 16px; padding: 10px 20px 12px; box-shadow: 0 6px 20px rgba(0,0,0,.18); transition: none;
  }
  #badge .era { color: #1f7ae0; font-weight: bold; font-size: 18px; }
  #badge .ttl { font-size: 32px; font-weight: 900; color: #1f2a37; }
  #sub {
    position: absolute; left: 0; right: 0; bottom: 34px; z-index: 6; text-align: center;
  }
  #sub span {
    display: inline-block; max-width: 1100px; background: rgba(15,25,40,.78); color: #fff;
    font-size: 30px; font-weight: bold; line-height: 1.45; padding: 10px 26px; border-radius: 14px;
    letter-spacing: 1px;
  }
  .card {
    position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; opacity: 0;
  }
  #titlecard { background: radial-gradient(ellipse at center, rgba(10,40,80,.55), rgba(10,30,60,.85)); }
  #titlecard h1 { font-size: 84px; margin: 0; letter-spacing: 8px; text-shadow: 0 6px 24px rgba(0,0,0,.5); }
  #titlecard h2 { font-size: 34px; margin: 14px 0 0; font-weight: normal; }
  #titlecard p { font-size: 20px; margin-top: 30px; opacity: .85; }
  #rewind { background: rgba(255,255,255,.35); color: #1f2a37; }
  #rewind div { font-size: 54px; font-weight: 900; background: rgba(255,255,255,.9); padding: 16px 40px; border-radius: 20px; }
  #endcard { background: linear-gradient(160deg, rgba(20,70,130,.92), rgba(10,35,70,.95)); }
  #endcard h1 { font-size: 64px; margin: 0 0 20px; }
  #endcard p { font-size: 24px; margin: 6px; }
</style>
</head>
<body>
<main id="view"></main>
<div id="badge"><div class="era"></div><div class="ttl"></div></div>
<div id="sub"><span></span></div>
<div id="titlecard" class="card">
  <h1>基隆河的搶水大戰</h1>
  <h2>為什麼基隆河要大轉彎？</h2>
  <p>根據 地質學家 林朝棨（1957）的研究</p>
</div>
<div id="rewind" class="card"><div>⏪ 時光倒流 … 回到六萬年前</div></div>
<div id="endcard" class="card">
  <h1>大地一直在改變！</h1>
  <p>基隆河：① 往東北東 → ② 轉彎往北北東 → ③ 再轉彎往西南西</p>
  <p style="margin-top:30px;opacity:.8;font-size:20px">參考資料：林朝棨（1957）基隆河河川襲奪研究｜地形為示意圖</p>
</div>
<script src="render.js"></script>
</body>
</html>
